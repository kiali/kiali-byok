name: PR — Build and Validate

# Runs on every pull request to main.
# Builds the container image (no push) and validates the merged index.
on:
  pull_request:
    branches:
      - main

jobs:
  build-validate:
    name: Build image and validate index
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: false
          tags: kiali-byok:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Extract index from image
        run: |
          docker create --name tmp-kiali-byok kiali-byok:pr-${{ github.event.pull_request.number }} true
          mkdir -p vector_db
          docker cp tmp-kiali-byok:/rag/vector_db/kiali vector_db/kiali
          docker rm tmp-kiali-byok

      - name: Validate index
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path

          path = Path('vector_db/kiali')
          required = [
              'default__vector_store.json',
              'docstore.json',
              'index_store.json',
              'metadata.json',
          ]
          missing = [f for f in required if not (path / f).exists()]
          if missing:
              print(f'FAIL: missing files: {missing}')
              sys.exit(1)

          meta = json.loads((path / 'metadata.json').read_text())
          print(f'OK: index-id={meta[\"index-id\"]}')
          print(f'    documents={meta.get(\"num-documents\", \"?\")}')
          print(f'    nodes={meta.get(\"num-nodes\", \"?\")}')
          print(f'    model={meta.get(\"embedding-model\", \"?\")}')
          "
