# Istio BYOK Index Configuration

index_id: istio-docs
index_name: "Istio Service Mesh Documentation"

source:
  type: web
  base_url: https://istio.io
  # Istio uses a sitemap index — point directly to the English sub-sitemap
  sitemap_path: /latest/en/sitemap.xml
  # Only index docs and FAQ, skip news/blog/release notes
  url_prefixes:
    - /latest/docs/
    - /latest/about/faq/
  max_pages: 500
  request_timeout: 30
  crawl_delay: 0.1

embedding_model: sentence-transformers/all-mpnet-base-v2

chunk_size: 512
chunk_overlap: 64

output_path: ./vector_db/istio
